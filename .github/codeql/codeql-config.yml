name: "tina4-js CodeQL config"

# Scan the shipped library source and the build/CLI tooling. Everything excluded
# below is NON-shipped or generated, so scanning it produces only noise:
#   - dist/**           committed, minified IIFE/bundle — CodeQL cannot read minified
#   - examples/**       demo apps + a built gallery bundle, never published
#   - tests/**          the test harness, not part of the npm package
#   - node_modules/**   dependencies (covered by Dependabot, not CodeQL)
paths-ignore:
  - dist
  - examples
  - tests
  - node_modules
