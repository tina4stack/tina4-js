name: CodeQL

# Static security analysis for the shipped JavaScript/TypeScript. tina4-js is a
# browser library (zero runtime deps), so CodeQL is the primary code-scanning
# gate here — there is no server-side audit surface. Runs on every PR into
# master, every push to master, and weekly to catch advisories in queries that
# land after a commit.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Mondays 03:27 UTC — off-peak, avoids the top-of-hour runner crush.
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript
          # Interpreted languages need no build.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: "/language:javascript-typescript"
