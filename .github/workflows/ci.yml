name: CI

# Runs on every pull request into master and every push to master, so the
# branch ruleset can require "test" to pass before a merge.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # llms.txt must follow the llmstxt.org spec (H1, > summary, no headings in
      # the free-form zone, H2 sections that hold only '- [name](url): notes'
      # links). Zero-dependency stdlib Python; the self-test proves the gate
      # rejects known-bad files before its verdict on the real one is trusted.
      - name: llms.txt follows the llmstxt.org spec
        run: |
          python3 scripts/check_llms_txt.py --self-test
          python3 scripts/check_llms_txt.py llms.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install (lockfile only)
        run: npm ci --ignore-scripts

      # `pretest` rebuilds dist/ first, so this also proves the build.
      - name: Test
        run: npm test

      - name: Committed bundle matches the source
        run: |
          npm run build:iife
          git diff --exit-code -- dist/tina4js.min.js
